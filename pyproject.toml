[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-wellness-coach"
version = "1.0.0"
description = "A multimodal mental wellness coach built on Gemma 3n."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["gemma", "wellness", "multimodal", "coaching", "mental-health"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The base install runs the full service on the echo engine, with no ML stack.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Gemma 3n inference.
ml = [
  "torch>=2.4",
  "transformers>=4.53",
  "accelerate>=0.30",
  "timm>=1.0",
  "bitsandbytes>=0.43; sys_platform == 'linux'",
]
# Fine-tuning (GPU only).
train = [
  "aura-wellness-coach[ml]",
  "unsloth>=2025.6",
  "unsloth_zoo",
  "trl>=0.12",
  "peft>=0.11",
  "datasets>=3.4.1,<4.0.0",
  "sentencepiece",
  "hf_transfer",
]
# Spoken replies and Whisper fallback ASR.
speech = [
  "aura-wellness-coach[ml]",
  "datasets>=3.4.1,<4.0.0",
  "soundfile>=0.12",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
aura = "aura.cli:main"

[project.urls]
Homepage = "https://github.com/arnavdsp/Gemma-3n-Hackathon"
Repository = "https://github.com/arnavdsp/Gemma-3n-Hackathon"

[tool.setuptools.packages.find]
where = ["src"]

# The web UI ships inside the package, so `pip install` produces a working app
# rather than an API with a silently missing front end.
[tool.setuptools.package-data]
aura = ["web/*.html", "web/*.css", "web/*.js", "web/**/*"]

# Vercel looks for the ASGI app here; the package layout is not one of its
# default entrypoint locations.
[tool.vercel]
entrypoint = "aura.api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["aura"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
